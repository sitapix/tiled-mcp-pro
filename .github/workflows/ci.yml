# CI: the `pnpm verify` gate (typecheck + build + contract:check + vitest).
#
# Efficiency notes, so future edits keep them intact:
# - Triggers are PRs plus pushes to main only. Feature-branch pushes are
#   covered by their PR run; triggering on both would double every run.
# - `concurrency` cancels superseded PR runs (a force-push mid-run otherwise
#   burns a full suite); main runs are never cancelled so every merge keeps
#   a complete record.
# - The pnpm store is cached against pnpm-lock.yaml via setup-node.
# - Tests that cross-check against a real Tiled install skip themselves in
#   CI (`hasTiledCli` is false); `verify:tiled-1.12.2` runs only on
#   machines that have Tiled, by hand.
#
# The Node 20 floor from `engines` is a RUNTIME commitment to users of the
# published package, not a toolchain one: pnpm 11 itself needs node:sqlite
# (Node >= 22) and crashes under Node 20, which the first live run proved.
# So the floor job installs and builds under current LTS, then switches to
# Node 20 and runs the suite through vitest directly — exercising dist/
# the way an `npx tiled-mcp-pro` user on the floor version would. Do not
# collapse it back into a pnpm-driven matrix leg.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run the suite on the engines floor
        run: |
          node --version
          npx vitest run
